# FWMS — بناء تطبيق أندرويد تلقائيًا + إصدار Release برابط دائم
# ---------------------------------------------------------------------------
# طلب المالك 2026-10-19: «يجب أن يشتغل سير بناء ملف apk بشكل آلي كلما نُشرت
# نسخة محسّنة أو أي تحديث، وينشئ رابطًا دائمًا لتحميل آخر نسخة».
#
# الاستراتيجية (كما وُثّقت في v0.10.0): غلاف Capacitor (webview) يشير إلى نشر
# Cloudflare الحي (fwms-dg8.pages.dev) — نفس الكود وسلوك واحد (SPEC §7)،
# لا نسخة أندرويد منفصلة تُصان يدويًا.
#
# المشغّلات: كل push إلى main (أي تحديث) + كل وسم v* + تشغيل يدوي (مع app_url).
#
# الإصدار: يُقرأ من src/lib/version.ts حصرًا (المصدر الوحيد للمنصة).
#   - الإصدار نفسه بعدّة pushes = تحديث نفس الـ Release وأصوله (clobber).
#   - رفع الإصدار = Release/وسم جديد يصير «الأحدث» تلقائيًا (--latest).
#
# الرابط الدائم لآخر نسخة (اسم أصل ثابت — لا يتغير أبدًا):
#   https://github.com/tarikchouika/F-W-M-S/releases/latest/download/FWMS.apk
#
# التوقيع: أسرار المستودع الأربعة (ANDROID_KEYSTORE_*) — مفتاح واحد ثابت عبر
# كل البناءات (يُمكّن التحديث فوق التثبيتات القائمة). وإن غابت الأسرار وُلِّد
# مفتاح ابتدائي يُرفع artifact «android-keystore-INITIAL» (سلوك احتياطي غير
# مستحسن — يكسر استمرارية التوقيع).
name: Android App Build

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "عنوان نشر الواجهة (افتراضي: بوابة Cloudflare)"
        required: false
        default: "https://fwms-dg8.pages.dev"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: true

env:
  APP_NAME: "FWMS"
  PACKAGE_ID: "ma.fwms.app"
  KEY_ALIAS: "fwms-release"

jobs:
  build:
    name: Build APK (Capacitor)
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.inputs.app_url || 'https://fwms-dg8.pages.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Read app version (src/lib/version.ts — single source)
        id: version
        run: |
          APP_VERSION=$(node -e "const s=require('fs').readFileSync('src/lib/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);if(!m){console.error('APP_VERSION not found in src/lib/version.ts');process.exit(1)}console.log(m[1])")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::warning::version.ts=$APP_VERSION != package.json=$PKG_VERSION — يُعتمد version.ts (المصدر الوحيد)."
          fi
          VERSION_CODE=$(printf '%s\n' "$APP_VERSION" | awk -F. '{printf "%d\n", $1*1000000 + $2*10000 + $3*100}')
          {
            echo "app_version=$APP_VERSION"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "FWMS_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"
          echo "→ الإصدار: $APP_VERSION (versionCode $VERSION_CODE)"

      - name: Show environment
        run: |
          echo "APP_URL=$APP_URL"
          echo "ANDROID_HOME=$ANDROID_HOME"
          node --version
          java -version

      - name: Scaffold app shell (www fallback)
        run: |
          mkdir -p android-shell/www
          cat > android-shell/www/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>FWMS</title>
              <style>
                body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; font-family:system-ui,sans-serif; background:#f8faf6; color:#14532d; text-align:center; }
                a { color:#14532d; font-weight:700; }
              </style>
            </head>
            <body>
              <h1>FWMS</h1>
              <p>يتطلب التطبيق اتصالًا بالإنترنت لفتح المنصة.</p>
              <a href="REPLACE_ME" id="open">فتح المنصة في المتصفح</a>
              <script>document.getElementById('open').href = location.origin.startsWith('http') ? location.origin : 'REPLACE_ME';</script>
            </body>
          </html>
          HTML
          sed -i "s|REPLACE_ME|$APP_URL|g" android-shell/www/index.html

      - name: Install Capacitor (no project deps touched)
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Init Capacitor + add Android platform
        working-directory: android-shell
        run: |
          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www --non-interactive || npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www
          # التطبيق يشير إلى النشر الحي مباشرة (server.url) — www مجرد احتياط بلا اتصال
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server = { url: process.env.APP_URL, cleartext: false };
            cfg.android = { allowMixedContent: false };
            cfg.androidScheme = 'https';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            console.log(JSON.stringify(cfg, null, 2));
          "
          npx cap add android

      - name: Prepare signing keystore
        working-directory: android-shell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # المفتاح وkeystore.properties داخل مشروع android/ (جذر rootProject)
          # حتى يُحلّ storeFile صحيحًا من rootProject.file() في build.gradle.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "→ استخدام مفتاح التوقيع الثابت من أسرار المستودع"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/android.keystore
            printf 'storeFile=android.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "${ANDROID_KEY_ALIAS:-$KEY_ALIAS}" "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
              > android/keystore.properties
            echo "KEYSTORE_FROM_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "→ ⚠ غياب الأسرار: توليد مفتاح ابتدائي (غير مستحسن — يكسر استمرارية التوقيع)"
            STOREPASS="Fwms$(openssl rand -hex 8)"
            keytool -genkeypair -v \
              -storetype PKCS12 -keystore android/android.keystore -storepass "$STOREPASS" \
              -alias "$KEY_ALIAS" -keypass "$STOREPASS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FWMS, OU=Field Workforce, O=FWMS, L=Casablanca, C=MA" >/dev/null 2>&1
            printf 'storeFile=android.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STOREPASS" "$KEY_ALIAS" "$STOREPASS" \
              > android/keystore.properties
            echo "KEYSTORE_FROM_SECRET=false" >> "$GITHUB_ENV"
          fi

      - name: Wire release signing + version into Gradle
        working-directory: android-shell/android
        run: |
          cat >> app/build.gradle <<'GRADLE'
          // CI signing + version (injected) — يقرأ android/keystore.properties
          def ksProps = new Properties()
          def ksFile = rootProject.file('keystore.properties')
          if (ksFile.exists()) {
            ksProps.load(new FileInputStream(ksFile))
          }
          android {
            defaultConfig {
              versionCode __VC__
              versionName "__VN__"
            }
            signingConfigs {
              release {
                storeFile rootProject.file(ksProps['storeFile'] ?: 'android.keystore')
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE
          sed -i "s/__VC__/${FWMS_VERSION_CODE:-1}/; s/__VN__/${APP_VERSION:-0.0.0}/" app/build.gradle
          echo "→ آخر 25 سطرًا من app/build.gradle:"
          tail -25 app/build.gradle

      - name: Build release APK
        working-directory: android-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Pandroid.injected.build.abi=arm64-v8a
          ls -la app/build/outputs/apk/release/

      - name: Collect APK (stable name for the permanent link)
        run: |
          mkdir -p dist
          cp android-shell/android/app/build/outputs/apk/release/app-release.apk dist/FWMS.apk
          ls -la dist/
          sha256sum dist/FWMS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fwms-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload initial keystore (fallback only)
        if: env.KEYSTORE_FROM_SECRET == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-INITIAL
          path: |
            android-shell/android/android.keystore
            android-shell/android/keystore.properties
          if-no-files-found: error

      - name: Instructions summary (fallback only)
        if: env.KEYSTORE_FROM_SECRET == 'false'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## مفتاح توقيع ابتدائي
          وُلِّد مفتاح توقيع جديد لهذا البناء ورفع ضمن artifact `android-keystore-INITIAL`.
          لتثبيت توقيع التطبيق عبر التحديثات (وإلا رُفض التثبيت فوق النسخ السابقة):
          1. نزّل الـ artifact وفك الضغط.
          2. أضف في أسرار المستودع: `ANDROID_KEYSTORE_BASE64` (محتوى android.keystore بـ base64)
             و`ANDROID_KEYSTORE_PASSWORD` و`ANDROID_KEY_ALIAS` و`ANDROID_KEY_PASSWORD`
             (قيمها داخل keystore.properties المرفوع).
          MD

      - name: Publish GitHub Release (tag v{version} + stable asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          TAG="v$APP_VERSION"
          PERMALINK="https://github.com/tarikchouika/F-W-M-S/releases/latest/download/FWMS.apk"
          NOTES="تطبيق أندرويد FWMS — غلاف Capacitor يشير إلى النشر الحي (fwms-dg8.pages.dev): كود واحد وسلوك واحد (SPEC §7).

          الرابط الدائم لآخر نسخة (لا يتغير أبدًا):
          $PERMALINK

          - الإصدار: v$APP_VERSION (versionCode $FWMS_VERSION_CODE)
          - البناء من commit: ${GITHUB_SHA::7} بتاريخ $(date -u '+%Y-%m-%d %H:%M UTC')
          - التوقيع: $([ "$KEYSTORE_FROM_SECRET" = "true" ] && echo 'مفتاح ثابت من أسرار المستودع' || echo 'مفتاح ابتدائي مؤقت (غير مستحبن)')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "→ الإصدار $TAG قائم — تحديث أصوله بنسخة هذا البناء (--clobber)"
            gh release edit "$TAG" --title "FWMS $APP_VERSION — Android" --notes "$NOTES" --latest || true
          else
            echo "→ إنشاء الإصدار $TAG"
            gh release create "$TAG" \
              --title "FWMS $APP_VERSION — Android" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release upload "$TAG" dist/FWMS.apk --clobber
          echo "✓ الرابط الدائم لآخر نسخة: $PERMALINK"
