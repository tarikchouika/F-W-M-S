# FWMS — بناء تطبيق أندرويد تلقائيًا + إصدار Release برابط دائم
# ---------------------------------------------------------------------------
# طلب المالك 2026-10-19: «يجب أن يشتغل سير بناء ملف apk بشكل آلي كلما نُشرت
# نسخة محسّنة أو أي تحديث، وينشئ رابطًا دائمًا لتحميل آخر نسخة».
#
# الاستراتيجية (كما وُثّقت في v0.10.0): غلاف Capacitor (webview) يشير إلى النشر الحي
# — نفس الكود وسلوك واحد (SPEC §7)، لا نسخة أندرويد منفصلة تُصان يدويًا.
#
# بلاغ المالك 2026-10-23 (تصدير/تحرير/تنزيل الوثائق + ملء الشاشة) — درسان مقيسان:
#   (1) كان الغلاف يشير إلى fwms-dg8.pages.dev وهي بوابة على نشر Vercel (لقطة
#       SQLite في /tmp لكل نسخة). الوثائق المولَّدة داخل التطبيق كانت تُكتب في
#       تلك اللقطة المؤقتة فيضيع الملف بين الطلبات/الطبعات (تنزيل فاشل) ويصير
#       التحقق «غير حقيقي» (not_found) — والرابط نفسه يعمل.
#       ⇒ الغلاف يشير الآن إلى الخادم المرجعي (بوابة الهاتف عبر النفق) حيث تُحفظ
#       الوثائق فعليًا. رابطا الوثيقة (pages.dev/vercel.app) يبقيان للمتحقق الخارجي
#       مع تحقق فدرالي على Vercel (راجع src/lib/reports/generate.ts).
#   (2) WebView لا ينفّذ <a download> على روابط blob ⇒ التصدير يبدو معطوبًا.
#       ⇒ جسر أندرويد أصلي (Filesystem + Share) في src/lib/native-bridge.ts.
#   (3) الشاشة: نافذة حافة-لحافة (edge-to-edge) + قياسات شرائط النظام الحقيقية
#       تُحقن في الويب (--fwms-inset-*) فلا يختفي أي عنصر تحت الشريطين.
#
# المشغّلات: كل push إلى main (أي تحديث) + كل وسم v* + تشغيل يدوي (مع app_url).
#
# الإصدار: يُقرأ من src/lib/version.ts حصرًا (المصدر الوحيد للمنصة).
#   - الإصدار نفسه بعدّة pushes = تحديث نفس الـ Release وأصوله (clobber).
#   - رفع الإصدار = Release/وسم جديد يصير «الأحدث» تلقائيًا (--latest).
#
# الرابط الدائم لآخر نسخة (اسم أصل ثابت — لا يتغير أبدًا):
#   https://github.com/tarikchouika/F-W-M-S/releases/latest/download/FWMS.apk
#
# التوقيع: أسرار المستودع الأربعة (ANDROID_KEYSTORE_*) — مفتاح واحد ثابت عبر
# كل البناءات (يُمكّن التحديث فوق التثبيتات القائمة). وإن غابت الأسرار وُلِّد
# مفتاح ابتدائي يُرفع artifact «android-keystore-INITIAL» (سلوك احتياطي غير
# مستحسن — يكسر استمرارية التوقيع).
name: Android App Build

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "عنوان الخادم المرجعي الذي يفتحه التطبيق (افتراضي: بوابة الهاتف)"
        required: false
        default: "https://fwms.tarikc.workers.dev"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: true

env:
  APP_NAME: "FWMS"
  PACKAGE_ID: "ma.fwms.app"
  KEY_ALIAS: "fwms-release"

jobs:
  build:
    name: Build APK (Capacitor)
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.inputs.app_url || 'https://fwms.tarikc.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Read app version (src/lib/version.ts — single source)
        id: version
        run: |
          APP_VERSION=$(node -e "const s=require('fs').readFileSync('src/lib/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);if(!m){console.error('APP_VERSION not found in src/lib/version.ts');process.exit(1)}console.log(m[1])")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::warning::version.ts=$APP_VERSION != package.json=$PKG_VERSION — يُعتمد version.ts (المصدر الوحيد)."
          fi
          VERSION_CODE=$(printf '%s\n' "$APP_VERSION" | awk -F. '{printf "%d\n", $1*1000000 + $2*10000 + $3*100}')
          {
            echo "app_version=$APP_VERSION"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "FWMS_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"
          echo "→ الإصدار: $APP_VERSION (versionCode $VERSION_CODE)"

      - name: Show environment
        run: |
          echo "APP_URL=$APP_URL"
          echo "ANDROID_HOME=$ANDROID_HOME"
          node --version
          java -version

      - name: Scaffold app shell (www fallback)
        run: |
          mkdir -p android-shell/www
          # i18n (بلاغ المالك «خلل في الترجمة»): صفحة الاحتياط كانت عربية حصرًا —
          # صارت رباعية اللغة بكشف لغة الجهاز (نفس مفاتيح روح القواميس).
          cat > android-shell/www/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>FWMS</title>
              <style>
                body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; font-family:system-ui,sans-serif; background:#f8faf6; color:#14532d; text-align:center; }
                a { color:#14532d; font-weight:700; }
              </style>
            </head>
            <body>
              <h1>FWMS</h1>
              <p data-i18n="hint">يتطلب التطبيق اتصالًا بالإنترنت لفتح المنصة.</p>
              <a href="REPLACE_ME" id="open" data-i18n="open">فتح المنصة في المتصفح</a>
              <script>
                var I18N = {
                  ar: { hint: "يتطلب التطبيق اتصالًا بالإنترنت لفتح المنصة.", open: "فتح المنصة في المتصفح", dir: "rtl" },
                  fr: { hint: "L'application nécessite une connexion Internet pour ouvrir la plateforme.", open: "Ouvrir la plateforme dans le navigateur", dir: "ltr" },
                  en: { hint: "The app requires an Internet connection to open the platform.", open: "Open the platform in the browser", dir: "ltr" },
                  es: { hint: "La aplicación necesita conexión a Internet para abrir la plataforma.", open: "Abrir la plataforma en el navegador", dir: "ltr" }
                };
                var nav = (navigator.language || "ar").slice(0, 2).toLowerCase();
                var s = I18N[nav] || I18N.ar;
                document.documentElement.lang = nav in I18N ? nav : "ar";
                document.documentElement.dir = s.dir;
                document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = s[el.getAttribute("data-i18n")]; });
                document.getElementById('open').href = location.origin.startsWith('http') ? location.origin : 'REPLACE_ME';
              </script>
            </body>
          </html>
          HTML
          sed -i "s|REPLACE_ME|$APP_URL|g" android-shell/www/index.html

      - name: Install Capacitor (no project deps touched)
        run: |
          # الإضافات الثلاث ضرورية لبلاغ المالك 2026-10-23:
          # status-bar (نمط الشريط العلوي) · filesystem + share (تنزيل الوثائق
          # داخل WebView عبر مشاركة النظام — WebView لا ينفّذ <a download>).
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            @capacitor/status-bar@6 @capacitor/filesystem@6 @capacitor/share@6

      - name: Write Capacitor config + add Android platform
        working-directory: android-shell
        run: |
          # الإعداد يُكتب مباشرة (لا cap init): حتمي بلا تبعية لصيغة تختارها CLI —
          # درس التشغيل الأول: cap init أنشأ capacitor.config.ts (لا .json) ففشلت قراءته.
          cat > package.json <<PKG
          {
            "name": "fwms-android-shell",
            "version": "$APP_VERSION",
            "private": true
          }
          PKG
          # التطبيق يشير إلى الخادم المرجعي مباشرة (server.url) — www احتياط بلا اتصال.
          # overlaysWebView: المحتوى يمتد تحت شريط الحالة (الشاشة الكاملة) والقياسات
          # تُحقن من MainActivity لتفادي اختفاء أي عنصر تحته.
          # includePlugins: الإضافات الأصلية الثلاث تُربط في مشروع gradle — اكتشاف
          # Capacitor يقرأ dependencies من package.json، وهذا الملف مكتوب بلا تبعيات
          # (الإضافات مثبّتة --no-save) فالقائمة الصريحة هي الطريق الحتمي (مُختبَر).
          cat > capacitor.config.json <<CFG
          {
            "appId": "$PACKAGE_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "$APP_URL",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false,
              "backgroundColor": "#0f2242"
            },
            "includePlugins": [
              "@capacitor/status-bar",
              "@capacitor/filesystem",
              "@capacitor/share"
            ],
            "plugins": {
              "StatusBar": {
                "overlaysWebView": true,
                "style": "DEFAULT"
              }
            },
            "androidScheme": "https"
          }
          CFG
          echo "→ capacitor.config.json:"
          cat capacitor.config.json
          npx cap add android
          echo "→ android/ project:"
          ls android/

      - name: Patch Android project (edge-to-edge window + native downloads)
        working-directory: android-shell
        run: |
          # ── (1) MainActivity: نافذة حافة-لحافة + حقن قياسات الشرائط في الويب ──
          # القياسات تأتي من WindowInsets الفعلية (لا تقدير): أزرار النظام و«الجزّة»
          # ولوحة المفاتيح — فتُضبط حشوات الصفحة ولا يختفي أي زر تحتها.
          MAIN="android/app/src/main/java/ma/fwms/app/MainActivity.java"
          cat > "$MAIN" <<'JAVA'
          package ma.fwms.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.WebViewListener;

          /**
           * FWMS — نشاط التطبيق (بلاغ المالك 2026-10-23):
           * شاشة كاملة تمتد تحت شريط الحالة وشريط التنقل (edge-to-edge)، مع حقن
           * قياس الشرائط الفعلية في الويب كمتغيّرات CSS (--fwms-inset-*) بعد كل
           * تحميل صفحة — فلا يغطي أي شريط عنصرًا من الواجهة.
           * كل شيء داخل try/catch: أي فشل هنا لا يُسقط التطبيق (الويب يحمل احتياطي
           * env(safe-area-inset-*)).
           */
          public class MainActivity extends BridgeActivity {
              // جسر الويب محفوظ كحقل: مستمع الـinsets يمرّر View لا WebView (اكتُشف بتحقّق نوعي)
              private WebView bridgeWebView;
              private int insetTop;
              private int insetBottom;
              private int insetLeft;
              private int insetRight;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                      bridgeWebView = getBridge().getWebView();

                      // التنقّل الكامل (دخول/خروج) ينشئ <html> جديدًا ⇒ إعادة الحقن
                      getBridge().addWebViewListener(new WebViewListener() {
                          @Override
                          public void onPageLoaded(WebView view) {
                              injectInsets();
                          }
                      });

                      ViewCompat.setOnApplyWindowInsetsListener(bridgeWebView, (view, insets) -> {
                          final int bars = WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout();
                          insetTop = insets.getInsets(bars).top;
                          insetLeft = insets.getInsets(bars).left;
                          insetRight = insets.getInsets(bars).right;
                          // الأسفل = الأكبر بين شريط التنقّل ولوحة المفاتيح (حقول النماذج)
                          insetBottom = Math.max(insets.getInsets(bars).bottom, insets.getInsets(WindowInsetsCompat.Type.ime()).bottom);
                          injectInsets();
                          return ViewCompat.onApplyWindowInsets(view, insets);
                      });

                      bridgeWebView.post(() -> ViewCompat.requestApplyInsets(bridgeWebView));
                  } catch (Throwable ignored) {
                      // لا شيء: الويب يعمل بلا القياسات (المتصفح/الاحتياطي)
                  }
              }

              /** كتابة القياسات (بكسل مستقل عن الكثافة) في جذر المستند */
              private void injectInsets() {
                  try {
                      final WebView webView = bridgeWebView;
                      final float density = getResources().getDisplayMetrics().density;
                      if (density <= 0f || webView == null) return;
                      final String js = "document.documentElement.style.setProperty('--fwms-inset-top','" + Math.round(insetTop / density) + "px');"
                          + "document.documentElement.style.setProperty('--fwms-inset-bottom','" + Math.round(insetBottom / density) + "px');"
                          + "document.documentElement.style.setProperty('--fwms-inset-left','" + Math.round(insetLeft / density) + "px');"
                          + "document.documentElement.style.setProperty('--fwms-inset-right','" + Math.round(insetRight / density) + "px');";
                      webView.post(() -> {
                          try {
                              webView.evaluateJavascript(js, null);
                          } catch (Throwable ignored) {
                              // لا شيء
                          }
                      });
                  } catch (Throwable ignored) {
                      // لا شيء
                  }
              }
          }
          JAVA
          test -s "$MAIN" || { echo "✗ MainActivity.java لم يُكتب"; exit 1; }
          grep -q "setDecorFitsSystemWindows" "$MAIN" || { echo "✗ رقعة حافة-لحافة مفقودة"; exit 1; }
          # تحقّق نوعي: مستمع الـinsets يمرّر View لا WebView ⇒ الجسر المحفوظ يُستعمل داخل injectInsets
          grep -q "private WebView bridgeWebView" "$MAIN" || { echo "✗ متغيّر الجسر مفقود"; exit 1; }

          # ── (2) الأنماط: نافذة حافة-لحافة + شرائط شفافة (نهاري/ليلي) ──
          STYLES="android/app/src/main/res/values/styles.xml"
          mkdir -p android/app/src/main/res/values-night
          write_styles() {
            cat > "$1" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <!-- Base application theme. -->
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>

              <!-- شاشة البدء + نافذة حافة-لحافة (بلاغ المالك 2026-10-23) -->
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">$2</item>
                  <item name="android:windowLightNavigationBar">$2</item>
              </style>
          </resources>
          XML
          }
          write_styles "$STYLES" "true"
          write_styles "android/app/src/main/res/values-night/styles.xml" "false"
          grep -q "windowLayoutInDisplayCutoutMode" "$STYLES" || { echo "✗ رقعة النافذة مفقودة"; exit 1; }

          # ── (3) النشاط: لوحة المفاتيح تُعيد ضبط الحجم لا تغطي الحقول ──
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import re, sys
          path = sys.argv[1]
          xml = open(path, encoding="utf-8").read()
          if 'windowSoftInputMode' not in xml:
              xml = re.sub(r'(\s+)android:launchMode="singleTask"',
                           r'\1android:windowSoftInputMode="adjustResize"\1android:launchMode="singleTask"',
                           xml, count=1)
          open(path, "w", encoding="utf-8").write(xml)
          PY
          grep -q "windowSoftInputMode" "$MANIFEST" || { echo "✗ رقعة لوحة المفاتيح مفقودة"; exit 1; }

          # ── (4) androidx.core صريحة (WindowInsetsCompat في MainActivity) ──
          printf '\ndependencies {\n    implementation "androidx.core:core:1.12.0"\n}\n' >> android/app/build.gradle

          # ── (5) مزامنة الإضافات (status-bar/filesystem/share) في مشروع gradle ──
          npx cap sync android
          echo "→ إضافات Capacitor المرتبطة:"
          grep -h "capacitor-" android/capacitor.settings.gradle
          for P in capacitor-status-bar capacitor-filesystem capacitor-share; do
            grep -q "$P" android/capacitor.settings.gradle || { echo "✗ إضافة $P غير مرتبطة"; exit 1; }
          done
          echo "→ إضافات مُسجَّلة للتحميل وقت التشغيل:"
          cat android/app/src/main/assets/capacitor.plugins.json
          for P in status-bar filesystem share; do
            grep -q "@capacitor/$P" android/app/src/main/assets/capacitor.plugins.json || { echo "✗ إضافة $P غير مُسجَّلة"; exit 1; }
          done

      - name: Brand the launcher icon (FWMS logo — أمر المالك 2026-10-23)
        working-directory: android-shell
        run: |
          # استبدال أيقونات Capacitor الافتراضية بأيقونات اللوغو المعتمد المولَّدة
          # من public/brand/logo-source.jpg عبر scripts/gen-brand-assets.mjs (مخزَّنة
          # في infra/android/launcher/ داخل المستودع — حتمية بلا اعتماد على أدوات الصور).
          # التغطية: legacy + round + adaptive (foreground/monochrome) + لون الخلفية.
          RES="android/app/src/main/res"
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$D"
            cp "../infra/android/launcher/mipmap-$D/ic_launcher.png"           "$RES/mipmap-$D/ic_launcher.png"
            cp "../infra/android/launcher/mipmap-$D/ic_launcher_round.png"     "$RES/mipmap-$D/ic_launcher_round.png"
            cp "../infra/android/launcher/mipmap-$D/ic_launcher_foreground.png" "$RES/mipmap-$D/ic_launcher_foreground.png"
            cp "../infra/android/launcher/mipmap-$D/ic_launcher_monochrome.png" "$RES/mipmap-$D/ic_launcher_monochrome.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26"
          cp ../infra/android/launcher/mipmap-anydpi-v26/ic_launcher.xml        "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          cp ../infra/android/launcher/mipmap-anydpi-v26/ic_launcher_round.xml  "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          # نفس اسم ملف القالب — كتابة فوقه (ملف ثانٍ = Duplicate resources في دمج موارد Android)
          mkdir -p "$RES/values"
          cp ../infra/android/launcher/values/ic_launcher_background.xml       "$RES/values/ic_launcher_background.xml"
          echo "→ أيقونات التطبيق: $(find $RES/mipmap* -name 'ic_launcher*' | wc -l) ملفًا من لوغو المنصة"
          # تحقق حتمي: أيقونة فارغة أو مفقودة تُسقط البناء (لا صمت أبدًا)
          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png" || { echo "✗ ic_launcher.png مفقودة"; exit 1; }
          test -s "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png" || { echo "✗ ic_launcher_foreground.png مفقودة"; exit 1; }

      - name: Prepare signing keystore
        working-directory: android-shell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # المفتاح وkeystore.properties داخل مشروع android/ (جذر rootProject)
          # حتى يُحلّ storeFile صحيحًا من rootProject.file() في build.gradle.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "→ استخدام مفتاح التوقيع الثابت من أسرار المستودع"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/android.keystore
            printf 'storeFile=android.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "${ANDROID_KEY_ALIAS:-$KEY_ALIAS}" "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
              > android/keystore.properties
            echo "KEYSTORE_FROM_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "→ ⚠ غياب الأسرار: توليد مفتاح ابتدائي (غير مستحسن — يكسر استمرارية التوقيع)"
            STOREPASS="Fwms$(openssl rand -hex 8)"
            keytool -genkeypair -v \
              -storetype PKCS12 -keystore android/android.keystore -storepass "$STOREPASS" \
              -alias "$KEY_ALIAS" -keypass "$STOREPASS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FWMS, OU=Field Workforce, O=FWMS, L=Casablanca, C=MA" >/dev/null 2>&1
            printf 'storeFile=android.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STOREPASS" "$KEY_ALIAS" "$STOREPASS" \
              > android/keystore.properties
            echo "KEYSTORE_FROM_SECRET=false" >> "$GITHUB_ENV"
          fi

      - name: Wire release signing + version into Gradle
        working-directory: android-shell/android
        run: |
          cat >> app/build.gradle <<'GRADLE'
          // CI signing + version (injected) — يقرأ android/keystore.properties
          def ksProps = new Properties()
          def ksFile = rootProject.file('keystore.properties')
          if (ksFile.exists()) {
            ksProps.load(new FileInputStream(ksFile))
          }
          android {
            defaultConfig {
              versionCode __VC__
              versionName "__VN__"
            }
            signingConfigs {
              release {
                storeFile rootProject.file(ksProps['storeFile'] ?: 'android.keystore')
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE
          sed -i "s/__VC__/${FWMS_VERSION_CODE:-1}/; s/__VN__/${APP_VERSION:-0.0.0}/" app/build.gradle
          echo "→ آخر 25 سطرًا من app/build.gradle:"
          tail -25 app/build.gradle

      - name: Build release APK
        working-directory: android-shell/android
        run: |
          # بلا android.injected.build.abi: الخاصية تنقل المخرجات إلى apk/<abi>/release/
          # وتغلاف webview لا يحوي مكتبات native — لا فائدة حجمية منها.
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "→ مخرجات البناء:"
          find app/build/outputs -name "*.apk" -type f -exec ls -la {} \;

      - name: Collect APK (stable name for the permanent link)
        run: |
          # جمع حتمي بـ find — لا افتراض لمسار مخرجات محدد
          APK="$(find android-shell/android/app/build/outputs -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "✗ لم يُعثر على أي APK في مخرجات البناء"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/FWMS.apk
          echo "→ المصدر: $APK"
          ls -la dist/
          sha256sum dist/FWMS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fwms-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload initial keystore (fallback only)
        if: env.KEYSTORE_FROM_SECRET == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-INITIAL
          path: |
            android-shell/android/android.keystore
            android-shell/android/keystore.properties
          if-no-files-found: error

      - name: Instructions summary (fallback only)
        if: env.KEYSTORE_FROM_SECRET == 'false'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## مفتاح توقيع ابتدائي
          وُلِّد مفتاح توقيع جديد لهذا البناء ورفع ضمن artifact `android-keystore-INITIAL`.
          لتثبيت توقيع التطبيق عبر التحديثات (وإلا رُفض التثبيت فوق النسخ السابقة):
          1. نزّل الـ artifact وفك الضغط.
          2. أضف في أسرار المستودع: `ANDROID_KEYSTORE_BASE64` (محتوى android.keystore بـ base64)
             و`ANDROID_KEYSTORE_PASSWORD` و`ANDROID_KEY_ALIAS` و`ANDROID_KEY_PASSWORD`
             (قيمها داخل keystore.properties المرفوع).
          MD

      - name: Publish GitHub Release (tag v{version} + stable asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          TAG="v$APP_VERSION"
          PERMALINK="https://github.com/tarikchouika/F-W-M-S/releases/latest/download/FWMS.apk"
          NOTES="تطبيق أندرويد FWMS — غلاف Capacitor يشير إلى النشر الحي (fwms-dg8.pages.dev): كود واحد وسلوك واحد (SPEC §7).

          الرابط الدائم لآخر نسخة (لا يتغير أبدًا):
          $PERMALINK

          - الإصدار: v$APP_VERSION (versionCode $FWMS_VERSION_CODE)
          - البناء من commit: ${GITHUB_SHA::7} بتاريخ $(date -u '+%Y-%m-%d %H:%M UTC')
          - التوقيع: $([ "$KEYSTORE_FROM_SECRET" = "true" ] && echo 'مفتاح ثابت من أسرار المستودع' || echo 'مفتاح ابتدائي مؤقت (غير مستحبن)')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "→ الإصدار $TAG قائم — تحديث أصوله بنسخة هذا البناء (--clobber)"
            gh release edit "$TAG" --title "FWMS $APP_VERSION — Android" --notes "$NOTES" --latest || true
          else
            echo "→ إنشاء الإصدار $TAG"
            gh release create "$TAG" \
              --title "FWMS $APP_VERSION — Android" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release upload "$TAG" dist/FWMS.apk --clobber
          echo "✓ الرابط الدائم لآخر نسخة: $PERMALINK"
