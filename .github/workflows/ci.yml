# HRMP — التكامل المستمر (SPEC §7): lint + build عند كل push
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: i18n parity (ar/fr/en/es)
        run: bun run check:i18n

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
          AUTH_SECRET: "ci-only-secret-value-not-for-production-000000"
